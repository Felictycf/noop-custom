name: iOS sideload build

on:
  workflow_dispatch:
  push:
    paths:
      - "Packages/**"
      - "StrandiOS/**"
      - "StrandiOSShared/**"
      - "StrandiOSWidgets/**"
      - "NOOPWatch*/**"
      - "project.yml"
      - ".github/workflows/ios-sideload-build.yml"
      - "Tools/anonymize-ios-app.sh"
      - "Tools/prepare-ios-sideload-app.sh"

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iPhone app
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for a physical iPhone
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build/ios-dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build

      - name: Prepare sideloadable IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/ios-dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP" || { echo "iOS app bundle not found" >&2; exit 1; }
          test -d "$APP/PlugIns/NOOPWidgets.appex" || {
            echo "NOOPWidgets.appex missing from iOS build" >&2
            exit 1
          }
          rm -rf "$APP/Watch"
          Tools/anonymize-ios-app.sh "$APP"
          Tools/prepare-ios-sideload-app.sh "$APP"
          STAGE="$RUNNER_TEMP/ipa-stage"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          (cd "$STAGE" && zip -qr "$RUNNER_TEMP/NOOP-custom-ios-unsigned.ipa" Payload)
          test -s "$RUNNER_TEMP/NOOP-custom-ios-unsigned.ipa"

      - name: Upload IPA for AltStore or SideStore
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-custom-ios-unsigned
          path: ${{ runner.temp }}/NOOP-custom-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
